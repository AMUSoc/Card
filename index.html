<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發送名片｜毛焦點</title>
<style>
  :root{--ink:#141414;--gold:#D4A845;--gold-dim:#8C7A4A;--text:#F2E6C4;--line:#3A3220}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto}
  .name{border-left:4px solid var(--gold);padding-left:14px;margin-bottom:8px}
  .name b{display:block;font-size:32px;color:var(--gold);letter-spacing:.02em}
  .name span{font-size:14px;color:var(--gold-dim);letter-spacing:.12em}
  .co{font-size:14px;margin:18px 0 32px;padding-bottom:14px;border-bottom:1px solid var(--gold)}
  .lang{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--gold);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .lang button{background:transparent;color:var(--gold);border:0;padding:14px 0;font-size:16px;font-family:inherit}
  .lang button+button{border-left:1px solid var(--line)}
  .lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:700}
  #send{width:100%;padding:18px;border:0;border-radius:14px;background:var(--gold);color:var(--ink);
    font-size:18px;font-weight:700;font-family:inherit}
  #send:disabled{opacity:.45}
  button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
  #msg{min-height:1.5em;margin-top:16px;font-size:14px;color:var(--gold-dim);text-align:center}
</style>
</head>
<body>
<main>
  <div class="name"><b id="pName">　</b><span id="pSub"></span></div>
  <div class="co" id="pCo"></div>
  <div class="lang" role="group" aria-label="名片語言">
    <button data-lang="zh" aria-pressed="true">中文</button>
    <button data-lang="en" aria-pressed="false">English</button>
    <button data-lang="ja" aria-pressed="false">日本語</button>
  </div>
  <button id="send" disabled>選擇好友，發送名片</button>
  <div id="msg">載入中…</div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = "2011796395-6VM5Sv5y";
const DEFAULT_MEMBER = "oc";

const UI = {
  zh:{send:"選擇好友，發送中文名片", call_m:"撥手機", call_o:"撥公司", line:"加 LINE", map:"導航", copy:"複製 Email", alt:n=>n+" 的名片"},
  en:{send:"選擇好友，發送英文名片", call_m:"Call mobile", call_o:"Call office", line:"Add on LINE", map:"Directions", copy:"Copy email", alt:n=>"Business card: "+n},
  ja:{send:"選擇好友，發送日文名片", call_m:"携帯に電話", call_o:"会社に電話", line:"LINE追加", map:"地図", copy:"メールをコピー", alt:n=>n+" の名刺"}
};

const GOLD="#D4A845", DIM="#8C7A4A", BG="#141414", LINE_C="#3A3220", SOFT="#E6C66E";
const $ = id => document.getElementById(id);
let member = null, lang = "zh";

function row(icon, text){
  return {type:"box",layout:"horizontal",spacing:"md",contents:[
    {type:"text",text:icon,size:"sm",flex:0},
    {type:"text",text:text,size:"sm",color:SOFT,wrap:true,flex:1}]};
}
function btn(label, action){
  return {type:"button",style:"primary",color:"#B8913A",height:"sm",action:Object.assign({label},action)};
}
function buildCard(m, l){
  const t = m[l], u = UI[l];
  const rows = [];
  if (m.mobile) rows.push(row("📱", m.mobile.show[l]));
  if (m.office) rows.push(row("☎️", m.office.show[l]));
  if (m.email)  rows.push(row("✉️", m.email));
  if (m.line_id) rows.push(row("💬", "LINE ID：" + m.line_id));
  if (t.address) rows.push(row("📍", t.address));

  const r1 = [], r2 = [];
  if (m.mobile) r1.push(btn(u.call_m,{type:"uri",uri:"tel:"+m.mobile.tel}));
  if (m.office) r1.push(btn(u.call_o,{type:"uri",uri:"tel:"+m.office.tel}));
  if (m.line_id) r2.push(btn(u.line,{type:"uri",uri:"https://line.me/ti/p/~"+encodeURIComponent(m.line_id)}));
  if (m.map_query) r2.push(btn(u.map,{type:"uri",uri:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(m.map_query)}));
  const footer = [];
  if (r1.length) footer.push({type:"box",layout:"horizontal",spacing:"sm",contents:r1});
  if (r2.length) footer.push({type:"box",layout:"horizontal",spacing:"sm",contents:r2});
  if (m.email) footer.push(btn(u.copy,{type:"clipboard",clipboardText:m.email}));

  return {type:"flex", altText:u.alt(t.name)+"｜"+t.company, contents:{
    type:"bubble",size:"mega",
    styles:{body:{backgroundColor:BG},footer:{backgroundColor:BG,separator:true,separatorColor:LINE_C}},
    body:{type:"box",layout:"vertical",paddingAll:"20px",spacing:"sm",contents:[
      {type:"text",text:t.title,size:"sm",weight:"bold",color:"#FFFFFF",wrap:true},
      {type:"box",layout:"horizontal",spacing:"md",margin:"md",contents:[
        {type:"box",layout:"vertical",width:"4px",backgroundColor:GOLD,contents:[]},
        {type:"box",layout:"vertical",contents:[
          {type:"text",text:t.name,size:"xxl",weight:"bold",color:GOLD,wrap:true},
          {type:"text",text:t.name_sub,size:"xs",color:DIM}]}]},
      {type:"text",text:t.company,size:"sm",color:SOFT,margin:"lg",wrap:true},
      {type:"text",text:t.company_sub,size:"xxs",color:DIM,wrap:true},
      {type:"separator",color:GOLD,margin:"md"},
      {type:"box",layout:"vertical",spacing:"sm",margin:"lg",contents:rows}]},
    footer:{type:"box",layout:"vertical",spacing:"sm",paddingAll:"16px",contents:footer}}};
}

function render(){
  const t = member[lang];
  $("pName").textContent = t.name;
  $("pSub").textContent = t.name_sub;
  $("pCo").textContent = t.title + "　" + t.company;
  $("send").textContent = UI[lang].send;
  document.querySelectorAll(".lang button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  if (!member || !member[b.dataset.lang]) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("card-lang", lang); } catch(e) {}
  render();
}));

$("send").addEventListener("click", async () => {
  try {
    const res = await liff.shareTargetPicker([buildCard(member, lang)]);
    $("msg").textContent = res ? "名片已送出" : "已取消，沒有發送";
  } catch (e) {
    $("msg").textContent = "發送失敗：" + (e.message || e);
  }
});

async function start(){
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

    const id = (new URLSearchParams(location.search).get("u") || DEFAULT_MEMBER).toLowerCase();
    const all = await (await fetch("members.json", {cache:"no-cache"})).json();
    member = all[id];
    if (!member) { $("msg").textContent = "找不到成員代號「" + id + "」，請確認連結。"; return; }

    try { const saved = localStorage.getItem("card-lang"); if (saved && member[saved]) lang = saved; } catch(e) {}
    render();

    if (!liff.isApiAvailable("shareTargetPicker")) {
      $("msg").textContent = "這個環境不能發送，請在 LINE 裡打開。";
      return;
    }
    $("send").disabled = false;
    $("msg").textContent = "";
  } catch (e) {
    $("msg").textContent = "初始化失敗：" + (e.message || e);
  }
}
start();
</script>
</body>
</html>
